# ------------------------------------------------------------------ profile
profile:
  experience_years: 4          # used for experience-band overlap checks

# --------------------------------------------------------------- job search
search:
  # Broad, generic title searches across ALL industries (Adzuna + Workday
  # matching downstream is done against the full CV, not these strings).
  titles:
    - Product Manager
    - Senior Product Manager
    - Business Analyst
    - Senior Business Analyst
    - Partnership Manager
    - Alliance Manager
    - Program Manager
    - Growth Manager
    - Product Owner

# ------------------------------------------------------------------ filters
filters:
  # A listing passes if ANY of these appears in its title (case-insensitive).
  title_keywords:
    - product manager
    - product owner
    - business analyst
    - program manager
    - growth manager
    - growth lead
    - partnership
    - alliance
  # City allowlist. Empty list = accept all cities. "remote" always passes.
  cities:
    - pune
    - mumbai
    - bangalore
    - bengaluru
    - remote
  # Annual INR. Enforced ONLY when the listing itself reports a salary.
  # Set to null to disable.
  min_salary_annual: null
  # Jobs scoring below this (0-100 STRUCTURED fit score) are still listed in
  # the CSV/digest for visibility, but are NOT tailored -- no point investing a
  # tailored resume in a weak fit. Raise for stricter targeting.
  #
  # RECALIBRATED 2026-07-28 (55 -> 50) when scoring moved to the ported
  # structured formula. The old value was silently starving the pipeline: on
  # the real 2026-07-16..27 queues only 1 of 12 jobs cleared 55 under the old
  # scorer, so almost nothing was ever tailored. Measured on those same queues,
  # 50 qualifies 7/12 -- a realistic daily tailoring volume against top_n: 25.
  # Re-measure before changing this; the score distribution is formula-specific.
  min_score_to_tailor: 50
  # true = only remote / work-from-home listings pass.
  remote_only: false

# ------------------------------------------------------------------ scoring
scoring:
  # Domain keywords add up to 20 BONUS points. They are never a filter --
  # strong matches from other industries must not be excluded.
  domain_keywords:
    - lending
    - credit
    - nbfc
    - fintech
    - loan
    - bfsi
    - digital banking
  # Structured sub-score weights. Omit to use the defaults in aggregate.py.
  # trajectory is deliberately the SMALLEST weight: a non-linear career (a step
  # sideways, a level down to change domain) is not a defect, and weighting it
  # heavily is how a scorer starts quietly penalising people for real lives.
  weights:
    skill_match: 0.40
    experience_fit: 0.20
    domain: 0.15
    education: 0.10
    achievement: 0.10
    trajectory: 0.05

# ------------------------------------------------------------------ sources
adzuna:
  country: in
  results_per_page: 50
  max_pages_per_title: 2       # polite pagination

workday:
  page_size: 20                # small pages, one poll per run
  detail_top_n: 8              # fetch full JDs for top N matches only
  tenants:
    - tenant: citi
      server: wd5
      site: "2"
      searches: ["product manager", "business analyst"]
    - tenant: db
      server: wd3
      site: DBWebsite
      searches: ["product manager", "business analyst"]
    - tenant: wf
      server: wd1
      site: WellsFargoJobs
      searches: ["product manager", "business analyst"]
    - tenant: mastercard
      server: wd1
      site: CorporateCareers
      searches: ["product manager", "business analyst"]
    - tenant: paypal
      server: wd1
      site: jobs
      searches: ["product manager", "business analyst"]
    - tenant: statestreet
      server: wd1
      site: Global
      searches: ["product manager", "business analyst"]
    - tenant: blackrock
      server: wd1
      site: BlackRock_Professional
      searches: ["product manager", "business analyst"]
    - tenant: adobe
      server: wd5
      site: external_experienced
      searches: ["product manager", "business analyst"]
    - tenant: salesforce
      server: wd12
      site: External_Career_Site
      searches: ["product manager", "business analyst"]

greenhouse:
  # Add ONLY confirmed board tokens, e.g. - razorpaysoftwareprivatelimited
  tokens: []

lever:
  # Add ONLY confirmed company tokens, e.g. - postman
  tokens: []

smartrecruiters:
  # Public postings API. Add confirmed company identifiers (the slug in
  # jobs.smartrecruiters.com/<identifier>).
  companies: []
  limit: 100
  detail_top_n: 5              # full JD for the first N per company only

ashby:
  # Public job-board API. Board name = the slug in jobs.ashbyhq.com/<board>.
  boards: []

# Job-alert email ingestion — the LEGITIMATE route to Naukri / LinkedIn /
# Indeed / Shine / foundit and any other portal with no public API.
#
# Those sites are never scraped: it violates their terms and risks the very
# accounts Mehul job-hunts with (see the design boundary in README.md). But
# they all email job alerts, and his own inbox is his own data. This reads that
# mailbox READ-ONLY -- never sends, replies, deletes, or marks anything read.
#
# Setup: create alerts on each portal -> filter them into a Gmail label ->
# generate a Gmail APP PASSWORD (not the account password) -> set
# JOB_ALERT_EMAIL and JOB_ALERT_APP_PASSWORD as secrets -> flip enabled: true.
# Credentials come from the environment only, never from this file.
job_alert_email:
  enabled: false
  imap_host: imap.gmail.com
  folder: job-alerts           # Gmail label, or INBOX
  lookback_days: 2             # daily run needs only the last day or two
  max_messages: 60

# ---------------------------------------------------------------- tailoring
tailor:
  provider: gemini             # gemini | groq | anthropic
  gemini_model: gemini-flash-lite-latest
  groq_model: llama-3.3-70b-versatile
  anthropic_model: claude-opus-4-8
  top_n: 25                    # tailor this many top matches per run

# ------------------------------------------------------------------- digest
digest:
  top_n: 15                    # jobs in the Telegram digest
  followup_days: 7             # nudge after N days with no recorded response
