greenhouse:
  # Verified 2026-07-28 by hitting the real API and confirming actual
  # India-located PM/BA/Partnerships postings (not just a valid token) —
  # see CLAUDE.md for the method. Add more only the same way: a token that
  # 200s with zero India PM/BA hits isn't worth a daily poll.
  tokens:
    - razorpaysoftwareprivatelimited   # Razorpay — Bengaluru PM + partnerships
    - stripe                           # Stripe — Bengaluru PM (India GCC)
    - coinbase                         # Coinbase — Remote-India PM
    - databricks                       # Databricks — Bengaluru/Mumbai alliance mgr
    - mongodb                          # MongoDB — Gurugram PM
    - okta                             # Okta — Bengaluru PM/alliances (India GCC)
    - phonepe                          # PhonePe — Bangalore PM

lever:
  # Verified the same way, 2026-07-28.
  tokens:
    - cred                             # CRED — Bengaluru partnerships
    - meesho                           # Meesho — Bangalore Group PM

smartrecruiters:
  # Public postings API. Verified the same way, 2026-07-28.
  companies:
    - ixigo                            # ixigo — Bengaluru/Gurgaon PM + partnerships
  limit: 100
  detail_top_n: 5              # full JD for the first N per company only

serpapi:
  # Google Jobs via SerpApi -- paid-tier route to Naukri/LinkedIn/Indeed
  # coverage (see CLAUDE.md, 2026-07-29). Off by default: needs SERPAPI_KEY
  # and an explicit flip to enabled: true. Uses search.serpapi_titles, a
  # narrower subset of the main title list, to stay under the free plan's
  # 250 searches/month.
  enabled: true
  monthly_quota: 250
  quota_buffer: 20             # stop this many searches short of the cap
  max_pages_per_title: 2        # 20 results/title; ~300 calls/month across
                                 # 5 titles, over the 250 free cap -- the
                                 # quota_buffer guard stops early and logs it
                                 # rather than erroring, so some days late in
                                 # the month will get fewer/no SerpApi results

ashby:
  # Public job-board API. Board name = the slug in jobs.ashbyhq.com/<board>.
  # Checked 2026-07-28 against ~40 companies known to use Ashby (Notion, Ramp,
  # Linear, Cursor, Vanta, Replit, Harvey, Zapier, Deliveroo, and several
  # India-origin candidates) — NONE currently have an India-located PM/BA
  # posting, so this ships empty rather than with tokens that would poll for
  # nothing. Re-check periodically; Ashby is growing fast among India startups.
  boards: []

# Job-alert email ingestion — the LEGITIMATE route to Naukri / LinkedIn /
# Indeed / Shine / foundit and any other portal with no public API.
#
# Those sites are never scraped: it violates their terms and risks the very
# accounts Mehul job-hunts with (see the design boundary in README.md). But
# they all email job alerts, and his own inbox is his own data. This reads that
# mailbox READ-ONLY -- never sends, replies, deletes, or marks anything read.
#
# Setup: create alerts on each portal -> filter them into a Gmail label ->
# generate a Gmail APP PASSWORD (not the account password) -> set
# JOB_ALERT_EMAIL and JOB_ALERT_APP_PASSWORD as secrets -> flip enabled: true.
# Credentials come from the environment only, never from this file.
job_alert_email:
  enabled: false
  imap_host: imap.gmail.com
  folder: job-alerts           # Gmail label, or INBOX
  lookback_days: 2             # daily run needs only the last day or two
  max_messages: 60

# ---------------------------------------------------------------- tailoring
tailor:
  provider: gemini             # gemini | groq | anthropic
  gemini_model: gemini-flash-lite-latest
  groq_model: llama-3.3-70b-versatile
  anthropic_model: claude-opus-4-8
  # Raised 25 -> 50 on 2026-07-28 after fixing Adzuna's dead credentials
  # (see CLAUDE.md): daily NEW volume jumped from ~10 to ~287 once it started
  # authenticating, so 25 tailored resumes/day was covering under 10% of the
  # qualifying jobs. Measured cost of raising this: the 2026-07-28 run
  # tailored 25 jobs in 76s (~3s/job, all first-try, zero 429/503 retries) --
  # 50 should land around 2.5 min, nowhere near the 30-min workflow timeout.
  # Gemini's exact free-tier daily/per-minute quota isn't something I can
  # verify from here, so this is a measured-safe increase, not a maxed-out
  # one -- watch the "tailor: gemini 429/503" retry log line in future runs
  # before raising further.
  top_n: 50                    # tailor this many top matches per run

# ------------------------------------------------------------------- digest
digest:
  # Raised 15 -> 50 on 2026-07-28 to match tailor.top_n, per explicit request:
  # "top 50 jobs visible every day, selected by match score." notify.py
  # already chunks the message under Telegram's 4096-char limit
  # (MAX_LEN = 3900), so this is not a technical constraint -- both this and
  # tailor.top_n slice the SAME score-sorted list (main.py: new_jobs.sort by
  # score descending happens before either selection), so "top 50" here and
  # "top 50 tailored" are the identical 50 jobs, not two different cuts.
  top_n: 50                    # jobs in the Telegram digest
  followup_days: 7             # nudge after N days with no recorded response

# ----------------------------------------------------------- apply_bridge
# Semi-assisted apply (2026-07-31): the dashboard's "Apply" link opens the
# job URL with one extra query parameter (?jtApply=1) in a new tab -- a plain
# link, no extension messaging or permissions involved. The CV Match Copilot
# (Gemini) Chrome extension's content script (already loaded automatically by
# Chrome on the hosts below) notices the marker and auto-runs its own
# JD-read -> tailor -> fill on that live page -- it sees the FULL JD, not the
# pipeline's truncated description_snippet -- then stops. Pressing Submit
# stays a human action, every time, no exception. This does NOT change what
# the pipeline itself tailors/sends in the Telegram digest; it's additive.
apply_bridge:
  enabled: true
  # Hosts the extension's manifest.json actually auto-fills on today --
  # every host in content_scripts.matches, not just the direct-apply ATS
  # platforms this pipeline sources from. CORRECTED 2026-08-01: live testing
  # found shine.com (a real source host, via SerpApi) already auto-runs on
  # the extension, but this list only had 4 entries -- the dashboard badge
  # was wrongly telling the user "opens only" on a host that actually
  # auto-fills. Any host still absent from this list opens fine on "Apply" --
  # the extension just won't auto-run there yet (documented gap, not a
  # crash). Kept here (not re-derived from the extension repo at runtime) so
  # the dashboard can show an honest per-row badge without reading a second
  # project's manifest -- re-sync this list by hand if that manifest changes.
  autofill_hosts:
    - linkedin.com
    - naukri.com
    - indeed.com
    - glassdoor.com
    - glassdoor.co.in
    - iimjobs.com
    - foundit.in
    - foundit.com
