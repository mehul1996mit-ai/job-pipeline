# ------------------------------------------------------------------ profile
profile:
  experience_years: 4          # used for experience-band overlap checks
  # The most experience a posting may ASK for and still be worth surfacing.
  # This is your ceiling, not a property of any job. Added 2026-08-09 after
  # VP-titled roles kept reaching the digest: title is a useless seniority
  # proxy (a bank "VP" is a ~6-10y IC, a startup "VP" is an exec), so
  # seniority.py judges on the experience the posting REQUIRES instead.
  comfort_max_years: 8
  # How far above experience_years a stated floor may sit and still count as
  # a reachable stretch rather than out of range.
  stretch_years: 2
  # Over-seniority demotion, applied as a MULTIPLIER on the final score
  # (changed 2026-08-19 from a flat -25 subtraction). A flat penalty is
  # scale-fragile: it was tuned against the old 42..100 score range, and when
  # the 2026-08-19 weight rebalance moved the real range to ~0..61 the same
  # -25 stopped demoting these jobs and started zeroing them outright, losing
  # all ordering among them. A proportional factor demotes identically at any
  # scale. Still a demotion, never a filter -- the row keeps its verdict in
  # the CSV so the human decides, per the 2026-08-09 design.
  over_senior_factor: 0.5
  # Softer factor when the verdict rests on an INFERRED band (title wording
  # only, no number stated anywhere in the posting). 49% of real over_senior
  # verdicts are inferred, and treating a guess as hard as a stated number was
  # burying BFSI "Senior Manager - Partnerships/Alliances" roles that sit
  # squarely in range. A guess should nudge, not bury.
  over_senior_factor_inferred: 0.85

# --------------------------------------------------------------- job search
search:
  # Skill-cluster-derived title list (see CLAUDE.md, 2026-07-29 revision) --
  # each title maps to a capability actually evidenced in resume_master.json,
  # not a guess. Matching downstream is still done against the full CV.
  titles:
    - Product Manager
    - Senior Product Manager
    - Digital Product Manager
    - Product Owner
    - Platform Product Manager
    - Technical Product Manager
    - Growth Product Manager
    - AI Product Manager
    - Partnership Manager
    - Channel Manager
    - Business Analyst
    - Senior Business Analyst
    - Product Analyst
    - Program Manager
    - Growth Manager

  # Narrower subset for SerpApi (Google Jobs) -- free tier is capped at
  # 250 searches/month. 5 broad terms x 30 days = ~150/month, leaving
  # headroom for pagination and repeated debug runs. Domain-narrowed
  # variants (Lending PM, Fintech PM, etc.) are deliberately excluded here --
  # the scoring bonus for lending/credit/fintech (see scoring.domain_keywords)
  # already surfaces those roles from the broad "Product Manager" query, so
  # a dedicated SerpApi query would spend quota without adding qualification,
  # only search-rank depth (see CLAUDE.md).
  serpapi_titles:
    - Product Manager
    - Business Analyst
    - Partnership Manager
    - Program Manager
    - Growth Manager

# ------------------------------------------------------------------ filters
filters:
  # A listing passes if ANY of these appears in its title (case-insensitive).
  #
  # NARROWED 2026-08-19. "project manager" and "performance marketing manager"
  # were added 2026-07-29 for volume and turned out to be the single biggest
  # source of irrelevance: they are different job families, and the scorer
  # cannot tell "Salesforce Project Manager" from a product role (it scored 69
  # and outranked real fintech PM roles). Measured across 2026-08-13..19,
  # 56% of queue rows and 80% of the TOP 10 existed only because of the
  # 07-29/08-11 filter widening. "channel manager"/"product analyst" are kept
  # -- both are genuinely adjacent to the partnerships and product work the CV
  # evidences.
  title_keywords:
    - product manager
    - product owner
    - business analyst
    - program manager
    - growth manager
    - growth lead
    - partnership
    - alliance
    - channel manager
    - product analyst
  # City allowlist. Empty list = accept all cities. "remote" always passes.
  # Widened 2026-08-10 (owner ask, volume too low): added the other major
  # India GCC/product hubs. Real day-by-day run logs showed ~520 jobs/day
  # already clearing every OTHER filter, so city was the actual bottleneck
  # worth loosening first -- unlike title/experience, widening geography
  # doesn't trade away relevance, just where you'd need to be.
  cities:
    - pune
    - mumbai
    - bangalore
    - bengaluru
    - hyderabad
    - delhi
    - gurugram
    - gurgaon
    - noida
    - chennai
    - remote
  # Annual INR. Enforced ONLY when the listing itself reports a salary.
  # Set to null to disable.
  min_salary_annual: 2000000
  # Jobs scoring below this (0-100 STRUCTURED fit score) are still listed in
  # the CSV/digest for visibility, but are NOT tailored -- no point investing a
  # tailored resume in a weak fit. Raise for stricter targeting.
  #
  # RECALIBRATED 2026-08-19 (50 -> 30) together with the scoring.weights
  # rebalance below. These two MUST move together: removing the CV-constant
  # sub-scores removed ~41 points of free floor from every job, so the real
  # score range fell from ~42..100 to ~6..61. Leaving the floor at 50 would
  # have tailored 0.4 jobs/day.
  #
  # Measured by replaying 323 real 2026-08-13..19 rows (post-narrowed-title-
  # filter) through the new scorer:
  #     floor 25 -> 16.3 jobs/day    floor 35 -> 3.0/day
  #     floor 30 ->  6.9 jobs/day    floor 50 -> 0.4/day
  # 30 clears every domain-relevant role in the replay (they score 45-61) plus
  # strong product roles with no domain hit (~39), and cuts the generic tail.
  # Lower to 25 if you want roughly double the tailoring volume at lower
  # average relevance. Re-measure before changing; formula-specific.
  min_score_to_tailor: 30
  # true = only remote / work-from-home listings pass.
  remote_only: false

# ------------------------------------------------------------------ scoring
scoring:
  # Domain keywords add up to 20 BONUS points. They are never a filter --
  # strong matches from other industries must not be excluded.
  domain_keywords:
    - lending
    - credit
    - nbfc
    - fintech
    - loan
    - bfsi
    - digital banking
  # Structured sub-score weights. Omit to use the defaults in aggregate.py.
  #
  # REBALANCED 2026-08-19. Only sub-scores that actually vary with the POSTING
  # are blended. education/achievement/trajectory are properties of the CV, not
  # of the fit -- measured over 919 real August-queue jobs, trajectory had a
  # standard deviation of 0.000 and education was pinned at 1.00 for 100% of
  # postings. Blending them handed every listing ~41 free points, so a
  # Registered Nurse posting scored 46 against a tailoring floor of 50 and real
  # fintech roles could not separate from unrelated work.
  #
  # These keys OVERRIDE aggregate.DEFAULT_WEIGHTS by dict update, so listing a
  # removed sub-score here would silently reinstate it. Don't re-add one
  # without re-reading aggregate.py's header and re-measuring the floor below.
  weights:
    skill_match: 0.55
    domain: 0.30
    experience_fit: 0.15

