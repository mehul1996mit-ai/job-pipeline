# ------------------------------------------------------------------ profile
profile:
  experience_years: 4          # used for experience-band overlap checks
  # The most experience a posting may ASK for and still be worth surfacing.
  # This is your ceiling, not a property of any job. Added 2026-08-09 after
  # VP-titled roles kept reaching the digest: title is a useless seniority
  # proxy (a bank "VP" is a ~6-10y IC, a startup "VP" is an exec), so
  # seniority.py judges on the experience the posting REQUIRES instead.
  comfort_max_years: 8
  # How far above experience_years a stated floor may sit and still count as
  # a reachable stretch rather than out of range.
  stretch_years: 2
  # Score penalty when a posting is judged over_senior. Deliberately large
  # enough to push a typical 50-60 scorer under filters.min_score_to_tailor,
  # so these stop consuming tailoring API calls and stop crowding the
  # digest's top-N — but NOT a hard filter: the row stays in the CSV with its
  # verdict visible. 51 of 86 reads are "inferred" (title wording, no stated
  # number), and hard-deleting on a guess would hide the bank-style VP roles
  # that genuinely are mid-level. Penalise, surface, let the human decide.
  over_senior_penalty: 25

# --------------------------------------------------------------- job search
search:
  # Skill-cluster-derived title list (see CLAUDE.md, 2026-07-29 revision) --
  # each title maps to a capability actually evidenced in resume_master.json,
  # not a guess. Matching downstream is still done against the full CV.
  titles:
    - Product Manager
    - Senior Product Manager
    - Digital Product Manager
    - Product Owner
    - Platform Product Manager
    - Technical Product Manager
    - Growth Product Manager
    - AI Product Manager
    - Partnership Manager
    - Channel Manager
    - Business Analyst
    - Senior Business Analyst
    - Product Analyst
    - Program Manager
    - Project Manager
    - Growth Manager
    - Performance Marketing Manager

  # Narrower subset for SerpApi (Google Jobs) -- free tier is capped at
  # 250 searches/month. 5 broad terms x 30 days = ~150/month, leaving
  # headroom for pagination and repeated debug runs. Domain-narrowed
  # variants (Lending PM, Fintech PM, etc.) are deliberately excluded here --
  # the scoring bonus for lending/credit/fintech (see scoring.domain_keywords)
  # already surfaces those roles from the broad "Product Manager" query, so
  # a dedicated SerpApi query would spend quota without adding qualification,
  # only search-rank depth (see CLAUDE.md).
  serpapi_titles:
    - Product Manager
    - Business Analyst
    - Partnership Manager
    - Program Manager
    - Growth Manager

# ------------------------------------------------------------------ filters
filters:
  # A listing passes if ANY of these appears in its title (case-insensitive).
  title_keywords:
    - product manager
    - product owner
    - business analyst
    - program manager
    - growth manager
    - growth lead
    - partnership
    - alliance
    - channel manager
    - product analyst
    - project manager
    - performance marketing manager
  # City allowlist. Empty list = accept all cities. "remote" always passes.
  cities:
    - pune
    - mumbai
    - bangalore
    - bengaluru
    - remote
  # Annual INR. Enforced ONLY when the listing itself reports a salary.
  # Set to null to disable.
  min_salary_annual: null
  # Jobs scoring below this (0-100 STRUCTURED fit score) are still listed in
  # the CSV/digest for visibility, but are NOT tailored -- no point investing a
  # tailored resume in a weak fit. Raise for stricter targeting.
  #
  # RECALIBRATED 2026-07-28 (55 -> 50) when scoring moved to the ported
  # structured formula. The old value was silently starving the pipeline: on
  # the real 2026-07-16..27 queues only 1 of 12 jobs cleared 55 under the old
  # scorer, so almost nothing was ever tailored. Measured on those same queues,
  # 50 qualifies 7/12 -- a realistic daily tailoring volume against top_n: 25.
  # Re-measure before changing this; the score distribution is formula-specific.
  min_score_to_tailor: 50
  # true = only remote / work-from-home listings pass.
  remote_only: false

# ------------------------------------------------------------------ scoring
scoring:
  # Domain keywords add up to 20 BONUS points. They are never a filter --
  # strong matches from other industries must not be excluded.
  domain_keywords:
    - lending
    - credit
    - nbfc
    - fintech
    - loan
    - bfsi
    - digital banking
  # Structured sub-score weights. Omit to use the defaults in aggregate.py.
  # trajectory is deliberately the SMALLEST weight: a non-linear career (a step
  # sideways, a level down to change domain) is not a defect, and weighting it
  # heavily is how a scorer starts quietly penalising people for real lives.
  weights:
    skill_match: 0.40
    experience_fit: 0.20
    domain: 0.15
    education: 0.10
    achievement: 0.10
    trajectory: 0.05

