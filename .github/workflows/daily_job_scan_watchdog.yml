name: Daily job scan watchdog

# GitHub's own `schedule:` trigger is documented as best-effort: it can be
# delayed, or in rare cases dropped with NO trace at all (no failed run, no
# queued run — just nothing). Confirmed live 2026-08-02: daily_job_scan.yml's
# 03:00 UTC trigger never fired that day; `gh run list` showed zero runs of
# any status. This is a second, INDEPENDENT scheduled trigger a few hours
# later that checks whether today's scan actually completed and dispatches
# it if not, then alerts Telegram so a missed day is always visible instead
# of silent. This reduces, but cannot fully eliminate, the risk — this
# trigger is itself a `schedule:` and shares the same best-effort guarantee.
# Two independent crons both dropping the same day is materially less likely
# than one, and either way you get told.
#
# Also off the round hour (2026-08-05 fix, same root cause as the primary
# workflow's comment): this watchdog was ALSO landing 7-9h late every day
# (05:00 UTC configured, actually ran ~12:00-14:00 UTC) because "0 5 * * *"
# queues behind every other repo's identical schedule. Confirmed live: it
# kept firing ~50min after the also-delayed primary run, which is why it
# never had to intervene despite both being chronically late — pure luck
# that the two delays roughly matched, not something to rely on.
on:
  schedule:
    - cron: "39 5 * * *" # 05:39 UTC / 11:09 IST
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether today's scan already ran
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          ran=$(gh run list --repo "${{ github.repository }}" \
            --workflow daily_job_scan.yml \
            --limit 50 \
            --json createdAt \
            --jq "[.[] | select(.createdAt | startswith(\"$today\"))] | length")
          echo "runs_today=$ran" >> "$GITHUB_OUTPUT"
          echo "Found $ran run(s) of daily_job_scan.yml created today ($today UTC)."

      - name: Dispatch the missed run
        if: steps.check.outputs.runs_today == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "No run found today — the primary 03:00 UTC schedule was likely dropped by GitHub. Dispatching now."
          gh workflow run daily_job_scan.yml --repo "${{ github.repository }}"

      - name: Alert Telegram that the watchdog had to intervene
        if: steps.check.outputs.runs_today == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="Job pipeline watchdog: today's 08:30 IST scheduled scan never fired (GitHub dropped the cron trigger). Triggered it manually just now — expect the digest a bit later than usual."
          else
            echo "Telegram secrets not set — skipping alert (dispatch above still ran)."
          fi
