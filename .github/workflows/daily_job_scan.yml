name: Daily job scan

on:
  schedule:
    # 03:17 UTC (08:47 IST), not the round 03:00. GitHub's scheduler queues
    # every repo's workflow that requested the exact same top-of-hour minute,
    # and that queueing is real, not theoretical here: checked run history
    # back to 07-23 and "0 3 * * *" was landing 09:20-13:30 UTC EVERY DAY,
    # 6-10h late, never once close to 03:00 (found + fixed 2026-08-05). An
    # off-round minute avoids the biggest cluster of competing schedules.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python main.py

      - name: Upload job queue CSV + tailored resumes as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-queue-${{ github.run_id }}
          path: |
            data/job_queue_*.csv
            data/resumes/**
          if-no-files-found: warn

      - name: Commit seen-store back to the repo
        run: |
          git config user.name "job-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json data/job_queue_*.csv
          [ -f data/followups.json ] && git add data/followups.json
          [ -f data/serpapi_usage.json ] && git add data/serpapi_usage.json
          true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update seen-store & queue $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Wake Streamlit dashboard
        if: always()
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://job-1357.streamlit.app"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, timeout=60000)
              wake_button = page.get_by_text("Yes, get this app back up!")
              if wake_button.count():
                  wake_button.click()
                  page.wait_for_timeout(20000)
                  print("Dashboard was asleep — woke it up.")
              else:
                  print("Dashboard already awake — nothing to do.")
              browser.close()
          PY
