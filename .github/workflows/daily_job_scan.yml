name: Daily job scan

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC (08:30 IST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Upload job queue CSV + tailored resumes as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-queue-${{ github.run_id }}
          path: |
            data/job_queue_*.csv
            data/resumes/**
          if-no-files-found: warn

      - name: Commit seen-store back to the repo
        run: |
          git config user.name "job-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json data/job_queue_*.csv || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update seen-store & queue $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
